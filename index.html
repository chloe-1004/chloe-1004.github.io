<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>한 사람의 문제에서 시작하는 UX/UI — 조혜민</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --accent: #bb71fc;
      --white: #ffffff;
      --bg: #040305;
    }

    html, body {
      background: var(--bg);
      color: var(--white);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Background ── */
    .bg-wrap {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      background: var(--bg);
    }

    /*
      Background image (1672×941) is rotated 90° to create vertical color bands,
      matching the Figma layout where a landscape image fills the page vertically.
      The element is sized so after rotation it exactly fills viewport width (100vw),
      and extends far above/below to cover the full page.
    */
    .bg-img {
      position: absolute;
      width: 178vw;
      height: 100vw;
      top: calc(50% - 50vw);
      left: calc(50% - 89vw);
      transform: rotate(90deg);
      background: url('bg.png') center / cover no-repeat;
    }

    .bg-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        #040305 0%,
        #040305 15%,
        rgba(4, 3, 5, 0.85) 35%,
        rgba(4, 3, 5, 0.55) 60%,
        rgba(4, 3, 5, 0.25) 100%
      );
    }

    /* ── Page Layout ── */
    .page {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: clamp(40px, 5.2vw, 100px);
    }

    /* ── Hero ── */
    .hero {
      width: 100%;
      min-height: clamp(400px, 56.25vw, 1080px);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: clamp(24px, 3vw, 60px) clamp(20px, 5.2vw, 100px) 0;
    }

    .title {
      margin-top: clamp(16px, 4vh, 60px);
      font-family: 'PretendardVariable', 'Pretendard', -apple-system, 'Apple SD Gothic Neo', sans-serif;
      font-weight: 800;
      font-size: clamp(32px, 6.25vw, 120px);
      line-height: 1.2;
      letter-spacing: -0.02em;
      color: var(--white);
    }

    .title .accent { color: var(--accent); }

    .hero-spacer { flex: 1; }

    .author {
      display: flex;
      align-items: center;
      gap: clamp(10px, 1.04vw, 20px);
      justify-content: center;
      margin-bottom: clamp(36px, 5vh, 80px);
      font-family: 'PretendardVariable', 'Pretendard', -apple-system, 'Apple SD Gothic Neo', sans-serif;
      font-weight: 500;
      font-size: clamp(15px, 2.08vw, 40px);
      letter-spacing: -0.02em;
      line-height: 1.6;
    }

    .author-divider {
      width: 1px;
      height: clamp(16px, 1.67vw, 32px);
      background: rgba(255, 255, 255, 0.6);
      flex-shrink: 0;
    }

    /* ── Overview Card ── */
    .overview-card {
      width: min(calc(100% - clamp(32px, 10.4vw, 200px)), 1720px);
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(50px);
      -webkit-backdrop-filter: blur(50px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: clamp(16px, 2.08vw, 40px);
      padding: clamp(28px, 5.2vw, 100px);
      display: flex;
      flex-direction: column;
      gap: clamp(24px, 4.17vw, 80px);
    }

    .overview-heading {
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: clamp(20px, 3.125vw, 60px);
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    /* ── Agenda Items ── */
    .item {
      display: flex;
      gap: clamp(10px, 1.04vw, 20px);
      align-items: flex-start;
    }

    .item-num {
      font-family: 'PretendardVariable', 'Pretendard', -apple-system, 'Apple SD Gothic Neo', sans-serif;
      font-weight: 800;
      font-size: clamp(20px, 3.125vw, 60px);
      line-height: 1.2;
      letter-spacing: -0.02em;
      flex-shrink: 0;
    }

    .item-body {
      display: flex;
      flex-direction: column;
      gap: clamp(6px, 1.04vw, 20px);
    }

    .item-title {
      font-family: 'PretendardVariable', 'Pretendard', -apple-system, 'Apple SD Gothic Neo', sans-serif;
      font-weight: 600;
      font-size: clamp(20px, 3.125vw, 60px);
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    .item-desc {
      font-family: 'PretendardVariable', 'Pretendard', -apple-system, 'Apple SD Gothic Neo', sans-serif;
      font-weight: 400;
      font-size: clamp(13px, 1.875vw, 36px);
      line-height: 1.5;
      letter-spacing: -0.02em;
      opacity: 0.8;
    }

    /* ── Responsive Overrides ── */
    @media (max-width: 768px) {
      .bg-img {
        /* On narrow viewports, fill using scale to ensure no gaps */
        width: max(178vw, 178vh);
        height: max(100vw, 100vh);
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) rotate(90deg);
      }
    }
  </style>
</head>
<body>

  <div class="bg-wrap">
    <div class="bg-img"></div>
    <div class="bg-gradient"></div>
  </div>

  <div class="page">
    <section class="hero">
      <h1 class="title">한 사람의 <span class="accent">문제</span>에서 시작하는<br>UX/UI</h1>
      <div class="hero-spacer"></div>
      <div class="author">
        <span>조혜민</span>
        <div class="author-divider"></div>
        <span>kakao product designer</span>
      </div>
    </section>

    <section class="overview-card">
      <h2 class="overview-heading">Overview</h2>

      <div class="item">
        <span class="item-num">1.</span>
        <div class="item-body">
          <span class="item-title">한 사람의 문제에서 시작하는 UX/UI</span>
        </div>
      </div>

      <div class="item">
        <span class="item-num">2.</span>
        <div class="item-body">
          <span class="item-title">미술에서 프로덕트 디자인까지</span>
          <p class="item-desc">서양화 전공 → 창업·해커톤 → 카카오 기획 → 프로덕트 디자인</p>
        </div>
      </div>

      <div class="item">
        <span class="item-num">3.</span>
        <div class="item-body">
          <span class="item-title">문제를 발견하는 법</span>
          <p class="item-desc">큰 사회문제에서 특정 사용자와 상황으로 좁히기. 실제 행동을 발견하는 인터뷰 방법</p>
        </div>
      </div>

      <div class="item">
        <span class="item-num">4.</span>
        <div class="item-body">
          <span class="item-title">문제를 화면으로 만드는 법</span>
          <p class="item-desc">로토타이핑, 디자인 의사결정, 기능 우선순위</p>
        </div>
      </div>

      <div class="item">
        <span class="item-num">5.</span>
        <div class="item-body">
          <span class="item-title">실무에서 디자인하는 법</span>
        </div>
      </div>

      <div class="item">
        <span class="item-num">6.</span>
        <div class="item-body">
          <span class="item-title">여러분의 프로젝트에 적용한다면?</span>
        </div>
      </div>
    </section>
  </div>

</body>
</html>
